            { step: '06', title: 'Support', desc: 'Provide improvements, maintenance, and ongoing support.' }

            e('h2', { className: 'text-3xl sm:text-5xl font-extrabold text-white' }, 'Experience That Combines Technology & Business'),

            e('h2', { className: 'text-3xl sm:text-5xl font-extrabold text-white' }, 'Frequently Asked Questions')

          e('div', { className: 'space-y-4' }, FAQS_DATA.map((faq, idx) => {
            const isOpen = openFaq === idx;

              key: idx,

              e('button', {

              isOpen && e('div', { className: 'px-6 pb-6 text-sm text-gray-300 leading-relaxed border-t border-white/5 pt-3' }, faq.a)

          e('form', { onSubmit: handleFormSubmit, className: 'bg-[#0D0D0D] border border-white/10 rounded-2xl p-8 space-y-6 max-w-3xl shadow-xl' }, [
            e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-6' }, [
              e('input', { type: 'text', required: true, placeholder: 'Your Name *', className: 'w-full p-3.5 rounded-xl bg-[#050505] border border-white/10 text-white text-sm focus:border-[#39FF14] outline-none' }),
              e('input', { type: 'email', required: true, placeholder: 'Email Address *', className: 'w-full p-3.5 rounded-xl bg-[#050505] border border-white/10 text-white text-sm focus:border-[#39FF14] outline-none' })

            e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-6' }, [

            e('div', { className: 'space-y-2' }, [
              e('label', { className: 'text-xs font-mono text-gray-300' }, 'PROJECT TYPE'),
              e('select', {
                value: selectedService,
                onChange: (ev) => setSelectedService(ev.target.value),
                className: 'w-full p-3.5 rounded-xl bg-[#050505] border border-white/10 text-white text-sm focus:border-[#39FF14] outline-none'
              }, [
                e('option', { value: 'ERPNext & ERP Solutions' }, 'ERPNext & ERP Solutions'),
                e('option', { value: 'Web Development' }, 'Web Development & Portals'),
                e('option', { value: 'AI & Automation' }, 'AI & Autonomous Agents'),
                e('option', { value: 'CRM & HRM Solutions' }, 'CRM & HRM Systems'),
                e('option', { value: 'Custom Software Development' }, 'Custom Enterprise Software'),
                e('option', { value: 'Digital Business Consulting' }, 'Digital Technology Advisory')
              ])
            ]),
            e('textarea', { rows: 4, required: true, placeholder: 'Briefly describe your project or requirements...', className: 'w-full p-3.5 rounded-xl bg-[#050505] border border-white/10 text-white text-sm focus:border-[#39FF14] outline-none resize-none' }),
            e('button', { type: 'submit', className: 'w-full py-4 rounded-xl bg-[#39FF14] text-black font-bold text-base shadow-[0_0_25px_rgba(57,255,20,0.4)] hover:bg-[#45ff24]' }, 'Send Project Inquiry →')
          ])
        ]),

        // PROJECT MODAL DIALOG
        activeModalProject && e('div', { className: 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md' }, [
          e('div', { className: 'bg-[#0D0D0D] border border-[#39FF14]/50 rounded-2xl p-8 max-w-2xl w-full space-y-6 shadow-2xl relative' }, [
            e('div', { className: 'flex justify-between items-center border-b border-white/10 pb-4' }, [
              e('h3', { className: 'text-2xl font-bold text-white' }, activeModalProject.title),
              e('button', { onClick: () => setActiveModalProject(null), className: 'text-gray-400 text-xl' }, '✕')
            ]),
            e('p', { className: 'text-sm text-gray-300 leading-relaxed' }, activeModalProject.longDesc),
            e('div', { className: 'p-4 rounded-xl bg-[#050505] border border-white/10 text-xs text-gray-300 space-y-1' }, [
              e('div', { className: 'text-[#39FF14] font-bold font-mono' }, 'MEASURABLE IMPACT:'),
              e('p', null, activeModalProject.impact)
            ]),
            e('button', {
              onClick: () => {
                setActiveModalProject(null);
                handleExploreService(`Custom Build like ${activeModalProject.title}`);
              },
              className: 'w-full py-3 rounded-xl bg-[#39FF14] text-black font-bold text-sm'
            }, 'Build Similar Solution →')
          ])
        ]),

        // FOOTER
        e('footer', { key: 'footer', className: 'bg-[#050505] border-t border-white/10 py-12 px-4 sm:px-8 text-center text-xs font-mono text-gray-500' }, [
          '© 2026 TECHYORA. All rights reserved. '
        ])

      ]);
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(e(StandalonePortfolioApp));
  </script>
